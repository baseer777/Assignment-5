<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ElectroMart - Product Price List</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
        margin: 20px;
      }

      h1 {
        text-align: center;
        color: #183153;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background-color: rgb(143, 132, 132);
      }

      th,
      td {
        border: 1px solid black;
        padding: 12px;
        text-align: left;
      }

      th {
        background-color: #183153;
        color: white;
      }

      tbody tr:nth-child(even) {
        background-color: #97a6b4;
      }

      tfoot {
        background-color: #a7acb3;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <h1>ElectroMart – Product Price List</h1>

    <table>
      <thead>
        <tr>
          <th>Product</th>
          <th>Category</th>
          <th>Price</th>
          <th>Stock</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td>Samsung A14</td>
          <td rowspan="2">Mobile</td>
          <td>$250</td>
          <td>Yes</td>
        </tr>

        <tr>
          <td>iPhone 13</td>
          <td>$799</td>
          <td>No</td>
        </tr>

        <tr>
          <td>HP Laptop 15</td>
          <td rowspan="2">Laptop</td>
          <td>$650</td>
          <td>Yes</td>
        </tr>

        <tr>
          <td>MacBook Pro</td>
          <td>$1200</td>
          <td>No</td>
        </tr>
      </tbody>

      <tfoot>
        <tr>
          <td colspan="4">Total Products: 4</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
